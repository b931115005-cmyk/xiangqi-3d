=5)||(s==='b'&&ty<=4))&&!b[y+dy/2][x+dx/2])add(x+dx,ty)}}else if(p.t==='a'){for(let [dx,dy] of [[1,1],[-1,1],[1,-1],[-1,-1]]){let tx=x+dx,ty=y+dy;if(tx>=3&&tx<=5&&((s==='r'&&ty>=7&&ty<=9)||(s==='b'&&ty>=0&&ty<=2)))add(tx,ty)}}else if(p.t==='k'){for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let tx=x+dx,ty=y+dy;if(tx>=3&&tx<=5&&((s==='r'&&ty>=7&&ty<=9)||(s==='b'&&ty>=0&&ty<=2)))add(tx,ty)}for(let dy of [-1,1])for(let ty=y+dy;inside(x,ty);ty+=dy){if(b[ty][x]){if(b[ty][x].t==='k'&&b[ty][x].s!==s)add(x,ty);break}}}else if(p.t==='p'){add(x,y+forward);if((s==='r'&&y<=4)||(s==='b'&&y>=5)){add(x-1,y);add(x+1,y)}}return a}function attacked(b,x,y,enemy){for(let j=0;j<10;j++)for(let i=0;i<9;i++)if(b[j][i]?.s===enemy&&pseudo(b,i,j).some(m=>m.tx===x&&m.ty===y))return true;return false}function moves(b,s){let result=[];for(let y=0;y<10;y++)for(let x=0;x<9;x++)if(b[y][x]?.s===s)for(let m of pseudo(b,x,y)){let n=apply(b,m),k=locate(n,s);if(k&&!attacked(n,k.x,k.y,s==='r'?'b':'r'))result.push(m)}return result}function check(b,s){let k=locate(b,s);return !k||attacked(b,k.x,k.y,s==='r'?'b':'r')}function rounded(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2)}function draw(){ctx.clearRect(0,0,W,H);let grd=ctx.createLinearGradient(0,0,W,H);grd.addColorStop(0,'#f6e3b9');grd.addColorStop(.5,'#d7b77e');grd.addColorStop(1,'#b98d56');ctx.fillStyle='#513d29';ctx.fillRect(18,16,684,768);ctx.fillStyle=grd;ctx.fillRect(27,25,666,750);ctx.strokeStyle='#513a20';ctx.lineWidth=2.2;for(let y=0;y<10;y++){ctx.beginPath();ctx.moveTo(X,Y+y*D);ctx.lineTo(X+8*D,Y+y*D);ctx.stroke()}for(let x=0;x<9;x++){ctx.beginPath();ctx.moveTo(X+x*D,Y);ctx.lineTo(X+x*D,Y+4*D);ctx.moveTo(X+x*D,Y+5*D);ctx.lineTo(X+x*D,Y+9*D);ctx.stroke()}for(let yy of [0,7]){ctx.beginPath();ctx.moveTo(X+3*D,Y+yy*D);ctx.lineTo(X+5*D,Y+(yy+2)*D);ctx.moveTo(X+5*D,Y+yy*D);ctx.lineTo(X+3*D,Y+(yy+2)*D);ctx.stroke()}ctx.fillStyle='#624521';ctx.font='bold 38px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('楚 河',X+2*D,Y+4.5* '+(check(board,turn)?' 將死':' 無棋可走')}else update();draw();if(!ended&&turn==='b'&&$('mode').value==='ai')aiMove()}function value(b){let score=0,pts={k:10000,r:600,c:320,h:300,e:130,a:120,p:70};for(let y=0;y<10;y++)for(let x=0;x<9;x++){let p=b[y][x];if(!p)continue;let v=pts[p.t]+(p.t==='p'?(p.s==='b'?y:9-y)*9:0);score+=(p.s==='b'?v:-v)}return score}function search(b,depth,alpha,beta,side){if(depth===0)return value(b);let mm=moves(b,side);if(!mm.length)return side==='b'?-20000-depth:20000+depth;mm.sort((a,z)=>(z.capture?1:0)-(a.capture?1:0));if(side==='b'){let best=-Infinity;for(let m of mm){best=Math.max(best,search(apply(b,m),depth-1,alpha,beta,'r'));alpha=Math.max(alpha,best);if(beta<=alpha)break}return best}else{let best=Infinity;for(let m of mm){best=Math.min(best,search(apply(b,m),depth-1,alpha,beta,'b'));beta=Math.min(beta,best);if(beta<=alpha)break}return best}}function aiMove(){thinking=true;update();setTimeout(()=>{if(!thinking||ended)return;let level=+$('level').value,mm=moves(board,'b');if(!mm.length)return;let ranked=mm.map(m=>{let n=apply(board,m);let score=level<=2?value(n):search(n,level===5?2:1,-Infinity,Infinity,'r');score+=Math.random()*(level===1?500:level===2?170:level===3?45:level===4?16:3);return {m,score}}).sort((a,b)=>b.score-a.score);thinking=false;play(ranked[0].m)},180)}cv.addEventListener('click',ev=>{if(ended||thinking||(turn==='b'&&$('mode').value==='ai'))return;let rect=cv.getBoundingClientRect(),x=Math.round((ev.clientX-rect.left)*W/rect.width/D-X/D),y=Math.round((ev.clientY-rect.top)*H/rect.height/D-Y/D);if(!inside(x,y))return;let m=legal.find(m=>m.tx===x&&m.ty===y);if(m){play(m);return}if(board[y][x]?.s===turn){selected={x,y};legal=moves(board,turn).filter(m=>m.fx===x&&m.fy===y)}else{selected=null;legal=[]}draw()});$('new').onclick=init;$('mode').onchange=init;$('undo').onclick=()=>{if(thinking||!history.length)return;let count=$('mode').value==='ai'&&turn==='r'?2:1;for(let i=0;i<count&&history.length;i++){let h=history.pop();board=h.board;turn=h.turn;moveNo=h.moveNo}ended=false;selected=null;legal=[];$('log').lastElementChild?.remove();if(count===2)$('log').lastElementChild?.remove();update();draw()};$('view').onclick=()=>{view=(view+1)%3;document.getElementById('boardWrap').style.setProperty('--tilt',['12deg','0deg','25deg'][view])};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent='音效：'+(soundOn?'開':'關')};init()})();
</script><script>if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn))}</script></body></html>
